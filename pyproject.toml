[project]
name = "attendance"
version = "0.1.0"
description = "Employee work-time tracking from a Hikvision face terminal, with daily and monthly reports to Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-telegram-bot[job-queue]>=21.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
attendance = "attendance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
